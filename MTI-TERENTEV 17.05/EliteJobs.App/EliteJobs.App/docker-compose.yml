services:
  postgres:
    image: postgres:16-alpine
    container_name: elite_db_net8
    env_file:
      - .env
    environment:
      POSTGRES_USER: eliteuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: EliteJobsDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata_net8:/var/lib/postgresql/data
    networks:
      - elite-network-net8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eliteuser -d EliteJobsDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: EliteJobs.App/Dockerfile
    container_name: elite_app_net8
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=EliteJobsDb;Username=eliteuser;Password=${DB_PASSWORD}
      - ASPNETCORE_URLS=http://+:80
      - Encryption__Key=${ENCRYPTION_KEY}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - ADMIN_ACCESS_KEY=${ADMIN_ACCESS_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
    ports:
      - "8080:80"
    volumes:
      - ./keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elite-network-net8

networks:
  elite-network-net8:
    driver: bridge

volumes:
  pgdata_net8: